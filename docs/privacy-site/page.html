<!doctype html>
<html lang="$language">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>$title · $app_name</title>
  <link rel="canonical" href="$canonical">
  <link rel="icon" href="${assets}icon.png">
  <link rel="stylesheet" href="${assets}style.css">
</head>
<body>
  <header class="page-bar">
    <div class="container bar-content">
      <a class="brand" href="https://github.com/AetherKiri/AetherUnzip">
        <img src="${assets}icon.png" width="36" height="36" alt="">
        <span>$app_name</span>
      </a>
      <nav class="languages" aria-label="$language_label">$language_links</nav>
    </div>
  </header>
  <main class="container">
    <article>
      <h1>$title</h1>
      <div class="policy">$policy</div>
    </article>
  </main>
</body>
</html>
