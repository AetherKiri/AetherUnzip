name: AetherUnzip
options:
  bundleIdPrefix: org.aetherunzip
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    CODE_SIGN_STYLE: Automatic
packages:
  AetherUnzipKit:
    path: ../../bindings/swift
targets:
  AetherUnzip:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macOS]
    sources:
      - App
      - Features
      - Models
      - path: Resources
        excludes: ["*.entitlements", "*.plist"]
        buildPhase: resources
      - path: ../../LICENSE
        buildPhase: resources
      - path: ../../third_party
        excludes: [README.md]
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AetherUnzip
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.aetherunzip.app
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE[sdk=macosx*]: Manual
        CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Resources/AetherUnzip.entitlements
    dependencies:
      - package: AetherUnzipKit
  AetherUnzipUITests:
    type: bundle.ui-testing
    platform: iOS
    supportedDestinations: [iOS, macOS]
    sources:
      - Tests
      - path: ../../tests/fixtures/sample.zip
        buildPhase: resources
      - path: ../../tests/fixtures/nested.zip
        buildPhase: resources
      - path: ../../tests/fixtures/sample.xp3
        buildPhase: resources
      - path: ../../tests/fixtures/xp3-wrapped.bin
        buildPhase: resources
      - path: ../../tests/fixtures/profile-box.bin
        buildPhase: resources
      - path: ../../tests/fixtures/format-profile.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AetherUnzip
schemes:
  AetherUnzip:
    build:
      targets:
        AetherUnzip: all
    run:
      config: Debug
    test:
      targets:
        - AetherUnzipUITests
